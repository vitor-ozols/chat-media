services:
  app:
    build: .
    image: chat-media
    container_name: chat-media
    restart: unless-stopped
    network_mode: host
    environment:
      HOME: /home/appuser
      CODEX_HOME: /home/appuser/.codex
      CODEX_BIN: "${CODEX_BIN:-/home/ozols/.local/bin/codex}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      STREAMLIT_SERVER_BASE_URL_PATH: "${BASE_PATH:-chat}"
      API_PORT: "${API_PORT:-5000}"
    volumes:
      - "${DATA_DIR:-./data}:/app/data"
      - "${MUSIC_DIR:-/mnt/sata/musics}:/app/media/music"
      - "${MOVIES_DIR:-/mnt/sata/movies}:/app/media/movies"
      - "${DOWNLOADS_DIR:-./downloads}:/app/downloads"
      # Explicit host paths avoid `${HOME}` becoming `/root` when Compose is
      # launched through sudo. Override these variables on another machine.
      - "${CODEX_CONFIG_DIR:-/home/ozols/.codex}:/home/appuser/.codex"
      - "${CODEX_AGENTS_DIR:-/home/ozols/.agents}:/home/appuser/.agents:ro"
      - "/mnt/sata:/mnt/sata"
      - "/home:/home"
      - "/:/host"
      - "/var/run/docker.sock:/var/run/docker.sock"
